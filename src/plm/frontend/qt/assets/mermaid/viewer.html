<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #fff; color: #111827; }
  #viewport { height: 100%; overflow: auto; cursor: grab; }
  #canvas { box-sizing: border-box; padding: 16px; min-width: 100%; min-height: 100%; }
  #canvas svg { display: block; margin: auto; max-width: none !important; }
</style>
<div id="viewport"><div id="canvas"></div></div>
<script src="core-js.min.js"></script>
<script src="mermaid.min.js"></script>
<script src="topology-routing.js"></script>
<script src="topology-layout.js"></script>
<script>
  let revision = 0, svgWidth = 0, svgHeight = 0, scale = 1;
  let queue = Promise.resolve();
  const viewport = document.getElementById('viewport');
  const canvas = document.getElementById('canvas');
  const report = (version, error) => console.info('PLM_TOPOLOGY:' + JSON.stringify({version, error}));

  function clarifyConnections(svg) {
    const ns = 'http://www.w3.org/2000/svg';
    // ELK positions edge text, but does not draw its background in Mermaid 10.
    for (const label of svg.querySelectorAll('.edgeLabel')) {
      const box = label.getBBox();
      if (!box.width || !box.height) continue;
      const background = document.createElementNS(ns, 'rect');
      const attributes = {x: box.x - 4, y: box.y - 2, width: box.width + 8,
        height: box.height + 4, rx: 3, fill: '#FFFFFF', opacity: '0.96',
        class: 'topology-label-background'};
      for (const [name, value] of Object.entries(attributes)) background.setAttribute(name, value);
      background.style.fill = '#FFFFFF';
      background.style.opacity = '0.96';
      background.style.stroke = '#E2E8F0';
      background.style.strokeWidth = '0.5px';
      label.prepend(background);
    }
    const inverse = svg.getCTM().inverse();
    const boxes = new Map();
    for (const rect of svg.querySelectorAll('.node > rect.label-container')) {
      const bounds = rect.getBBox(), matrix = inverse.multiply(rect.getCTM());
      boxes.set(rect.parentNode.getAttribute('data-id'), {
        left: bounds.x + matrix.e, right: bounds.x + matrix.e + bounds.width,
        top: bounds.y + matrix.f, bottom: bounds.y + matrix.f + bounds.height
      });
    }
    const ports = document.createElementNS(ns, 'g');
    ports.setAttribute('class', 'topology-ports');
    ports.style.pointerEvents = 'none';
    for (const path of svg.querySelectorAll('.flowchart-link')) {
      const style = getComputedStyle(path), matrix = inverse.multiply(path.getCTM());
      for (const prefix of ['LS-', 'LE-']) {
        const endpoint = Array.from(path.classList).find(name => name.startsWith(prefix));
        const box = endpoint && boxes.get(endpoint.slice(3));
        if (!box) continue;
        const point = path.getPointAtLength(prefix === 'LS-' ? 0 : path.getTotalLength()).matrixTransform(matrix);
        const port = document.createElementNS(ns, 'circle');
        port.setAttribute('class', 'topology-port');
        port.setAttribute('data-node', endpoint.slice(3));
        // The path ends before the arrowhead; project that point onto the box.
        port.setAttribute('cx', Math.max(box.left, Math.min(box.right, point.x)));
        port.setAttribute('cy', Math.max(box.top, Math.min(box.bottom, point.y)));
        port.setAttribute('r', 2.5);
        port.setAttribute('fill', style.stroke);
        port.setAttribute('opacity', style.opacity);
        ports.appendChild(port);
      }
    }
    svg.appendChild(ports);
  }

  function colorRouteMarkers(svg) {
    // Mermaid 10 shares a dark arrowhead across differently styled edges.
    // Clone it for highlighted edges so arrowheads match their line color.
    let defs = svg.querySelector('defs');
    if (!defs) {
      defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      svg.prepend(defs);
    }
    let index = 0;
    for (const path of svg.querySelectorAll('path[marker-end], path[marker-start]')) {
      const stroke = getComputedStyle(path).stroke;
      if (!stroke || stroke === 'none') continue;
      for (const attribute of ['marker-end', 'marker-start']) {
        const match = /#([^)'"\s]+)/.exec(path.getAttribute(attribute) || '');
        const original = match && svg.querySelector('[id="' + match[1] + '"]');
        if (!original) continue;
        const marker = original.cloneNode(true);
        marker.id = original.id + '_route_' + index++;
        for (const shape of marker.querySelectorAll('path, polygon, circle')) {
          shape.style.fill = stroke;
          shape.style.stroke = stroke;
        }
        defs.appendChild(marker);
        path.setAttribute(attribute, 'url(#' + marker.id + ')');
      }
    }
  }

  function resizeGraph() {
    const svg = canvas.querySelector('svg');
    if (svg) {
      svg.style.width = (svgWidth * scale) + 'px';
      svg.style.height = (svgHeight * scale) + 'px';
    }
  }
  window.fitTopology = function () {
    if (!svgWidth || !svgHeight) return;
    scale = Math.min((viewport.clientWidth - 32) / svgWidth,
                     (viewport.clientHeight - 32) / svgHeight, 1);
    scale = Math.max(0.01, scale);
    resizeGraph();
    viewport.scrollLeft = viewport.scrollTop = 0;
  };
  window.zoomTopology = function (factor) {
    scale = Math.max(0.01, Math.min(8, scale * factor));
    resizeGraph();
  };
  window.readTopology = function () {
    window.fitTopology();
    // Dense clock diagrams should open at a readable size; scroll to explore.
    scale = Math.max(0.75, scale);
    resizeGraph();
  };
  window.resetTopology = function () {
    scale = 1;
    resizeGraph();
    viewport.scrollLeft = viewport.scrollTop = 0;
  };
  window.invalidateTopology = function (version) {
    revision = version;
    canvas.textContent = '';
    svgWidth = svgHeight = 0;
  };
  window.renderTopology = function (source, version) {
    window.invalidateTopology(version);
    // Mermaid uses document-global temporary IDs. Serialize its render calls,
    // while discarding results whose revision has already been superseded.
    queue = queue.catch(() => {}).then(async () => {
      if (revision !== version) return;
      try {
        mermaid.initialize({
          startOnLoad: false, securityLevel: 'strict', theme: 'default',
          fontFamily: 'Arial, Microsoft YaHei, sans-serif',
          maxTextSize: 1000000, maxEdges: 10000,
          flowchart: { htmlLabels: false, useMaxWidth: false, defaultRenderer: 'elk' }
        });
        const result = await mermaid.render('topology_' + version, source);
        if (revision !== version) return;
        canvas.innerHTML = result.svg;
        const svg = canvas.querySelector('svg');
        colorRouteMarkers(svg);
        clarifyConnections(svg);
        svgWidth = svg.viewBox.baseVal.width;
        svgHeight = svg.viewBox.baseVal.height;
        window.readTopology();
        report(version, '');
      } catch (error) {
        if (revision !== version) return;
        canvas.textContent = '';
        report(version, String(error.message || error));
      }
    });
  };
  let drag = null;
  viewport.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    drag = {x: event.clientX, y: event.clientY, left: viewport.scrollLeft, top: viewport.scrollTop};
    viewport.setPointerCapture(event.pointerId);
    viewport.style.cursor = 'grabbing';
    event.preventDefault();
  });
  viewport.addEventListener('pointermove', event => {
    if (!drag) return;
    viewport.scrollLeft = drag.left - event.clientX + drag.x;
    viewport.scrollTop = drag.top - event.clientY + drag.y;
  });
  const endDrag = () => { drag = null; viewport.style.cursor = 'grab'; };
  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);
</script>
</html>
