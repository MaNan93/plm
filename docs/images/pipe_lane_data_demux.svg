<text x="30" y="958" class="small">Each panel retains its own 3 XOR + 2 AND + 1 OR. Identically named wires are the same net.</text>
<text x="30" y="993" class="small">No shared XOR, no constant folding, no assumption that p2m_tie equals SAFE_P2M.</text>
<text x="30" y="1025" class="small">RTL expression structure for this configuration; not a synthesized standard-cell netlist.</text>
</svg>