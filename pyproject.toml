[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plm"
version = "0.1.0"
description = "PIPE Lane Mapper RTL/testbench generator and config editors"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
qt = ["PyQt5>=5.15"]

[project.scripts]
plm = "plm.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"plm" = ["docs/*.md"]
"plm.core" = ["common/*.sv", "config/*.csv", "tb_makefile.mk"]
"plm.frontend.qt" = ["assets/*.png", "assets/*.svg", "assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/fonts/*.md"]
