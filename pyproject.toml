[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plm"
version = "3.0.0"
description = "PIPE Lane Mapper RTL/testbench generator and config editors"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
qt = ["PyQt5>=5.15"]

[project.scripts]
plm = "plm.cli.main:main"
plm-gui = "plm.frontend.qt.main:main"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["plm", "plm.*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"plm" = ["docs/*.md"]
"plm.core" = ["common/*.sv", "config/*.csv", "tb_makefile.mk"]
"plm.frontend.qt" = ["assets/*.png", "assets/*.svg", "assets/icons/*.svg", "styles/*.qss"]
