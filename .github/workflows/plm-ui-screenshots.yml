name: PLM UI screenshots
on:
  push:
    paths:
      - ".github/workflows/plm-ui-screenshots.yml"
      - "scripts/capture_ui.py"
      - "src/plm/frontend/qt/**"
  workflow_dispatch:
# Capture current Qt screens whenever UI code or the capture contract changes.
jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      # Install fallback fonts and Qt dependencies for screenshot rendering.
      - run: sudo apt-get update && sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libegl1 libgl1 libfontconfig1 libdbus-1-3 fonts-noto-cjk fonts-inter fonts-jetbrains-mono
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          working-directory: .
      - run: uv sync --extra qt --locked
      - name: Diagnose Qt xcb dependencies
        run: |
          plugin=$(find .venv -path '*/PyQt5/Qt5/plugins/platforms/libqxcb.so' -print -quit)
          echo "$plugin"
          ldd "$plugin" || true
      - run: xvfb-run -a -s "-screen 0 1600x1000x24" uv run python scripts/capture_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: plm-ui-screenshots
          path: ui-screenshots/
